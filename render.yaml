# Render Blueprint: one Node process owns all rooms and their physics worlds.
services:
  - type: web
    name: serra-runner-multiplayer
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run server:build
    startCommand: npm run server:start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
